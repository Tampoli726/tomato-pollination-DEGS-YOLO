# DDS-YOLO11n: YOLO11n with a P3/P4 dual-scale DDS head
# Only the DDS head idea is migrated. The native YOLO11 C3k2/C2PSA modules are retained.

nc: 1
scale: n
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                 # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]         # 2
  - [-1, 1, Conv, [256, 3, 2]]                # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]         # 4
  - [-1, 1, Conv, [512, 3, 2]]                # 5-P4/16
  - [-1, 2, C3k2, [512, True]]                # 6
  - [-1, 1, Conv, [1024, 3, 2]]               # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]               # 8
  - [-1, 1, SPPF, [1024, 5]]                  # 9
  - [-1, 2, C2PSA, [1024]]                    # 10

head:
  # Native top-down feature fusion
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]]                   # 12: P5 up + backbone P4
  - [-1, 2, C3k2, [512, False]]                 # 13: P4 feature

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]]                   # 15: P4 up + backbone P3
  - [-1, 2, C3k2, [256, False]]                 # 16: P3 feature

  # Native bottom-up aggregation to P4
  - [-1, 1, Conv, [256, 3, 2]]                  # 17: P3 -> P4
  - [[-1, 13], 1, Concat, [1]]                  # 18
  - [-1, 2, C3k2, [512, False]]                 # 19: enhanced P4

  # DDS head: re-aggregate P4 into the high-resolution P3 branch
  - [19, 1, nn.Upsample, [None, 2, "nearest"]] # 20: P4 -> P3 size
  - [[20, 16], 1, Concat, [1]]                  # 21: P4 up + P3
  - [21, 1, C3k2, [256, False]]                 # 22: enhanced P3'

  # Two-scale detection; P5 detection output is removed
  - [[22, 19], 1, Detect, [nc]]                 # 23: Detect(P3', P4)
