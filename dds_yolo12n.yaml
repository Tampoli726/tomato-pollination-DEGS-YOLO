# DDS-YOLO12n: YOLO12n with a P3/P4 dual-scale DDS head
# Only the DDS head idea is migrated. The native YOLO12 A2C2f/C3k2 modules are retained.

nc: 1
scale: n
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                 # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]          # 2
  - [-1, 1, Conv, [256, 3, 2]]                 # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]          # 4
  - [-1, 1, Conv, [512, 3, 2]]                 # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]             # 6
  - [-1, 1, Conv, [1024, 3, 2]]                # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]            # 8

head:
  # Native top-down feature fusion
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 9
  - [[-1, 6], 1, Concat, [1]]                   # 10: P5 up + backbone P4
  - [-1, 2, A2C2f, [512, False, -1]]            # 11: P4 feature

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 4], 1, Concat, [1]]                   # 13: P4 up + backbone P3
  - [-1, 2, A2C2f, [256, False, -1]]            # 14: P3 feature

  # Native bottom-up aggregation to P4
  - [-1, 1, Conv, [256, 3, 2]]                  # 15: P3 -> P4
  - [[-1, 11], 1, Concat, [1]]                  # 16
  - [-1, 2, A2C2f, [512, False, -1]]            # 17: enhanced P4

  # DDS head: re-aggregate P4 into the high-resolution P3 branch
  - [17, 1, nn.Upsample, [None, 2, "nearest"]] # 18: P4 -> P3 size
  - [[18, 14], 1, Concat, [1]]                  # 19: P4 up + P3
  - [19, 1, A2C2f, [256, False, -1]]            # 20: enhanced P3'

  # Two-scale detection; P5 detection output is removed
  - [[20, 17], 1, Detect, [nc]]                 # 21: Detect(P3', P4)
